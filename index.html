    <style>
      /* Fond avant hydratation : évite un flash blanc en dark mode. */
      html {
        background: #f2f2f7;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #000;
        }
      }
      html[data-theme='light'] {
        background: #f2f2f7;
      }
      html[data-theme='dark'] {
        background: #000;
      }
    </style>
    <script>
      // Applique le thème choisi avant le premier rendu (pas de flash).
      try {
        var t = localStorage.getItem('pmos:v1:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
