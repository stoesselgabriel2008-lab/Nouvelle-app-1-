<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PASS Methods OS</title>
    <meta
      name="description"
      content="Méthode → diagnostic → action. La bonne méthode de travail PASS, tout de suite, étape par étape."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Methods OS" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f2f2f7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#000000"
    />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      /* Fond avant hydratation : évite un flash blanc en dark mode. */
      html {
        background: #f2f2f7;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #000;
        }
      }
      html[data-theme='light'] {
        background: #f2f2f7;
      }
      html[data-theme='dark'] {
        background: #000;
      }
    </style>
    <script>
      // Applique le thème choisi avant le premier rendu (pas de flash).
      try {
        var t = localStorage.getItem('pmos:v1:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
