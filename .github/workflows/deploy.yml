name: Deploy PWA to GitHub Pages

# Déploiement par branche gh-pages : sur un dépôt public, GitHub Pages sert
# automatiquement cette branche, sans étape d'activation via l'API (le jeton
# de workflow n'a pas le droit de créer le site Pages sur ce dépôt).
on:
  push:
    branches:
      - main
      - claude/pass-methods-os-app-oo3pbk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (contenu, recherche, diagnostic)
        run: npm test

      - name: Build (typecheck + Vite + service worker)
        run: npm run build

      - name: Publish dist to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Déploiement ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
